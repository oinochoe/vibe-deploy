# [Azure 배포 파이프라인 — 예비]
# 기본은 .gitlab-ci.yml (AWS Lambda) 이다. Azure Static Web Apps 로 가려면 이 파일 내용을 .gitlab-ci.yml 로 교체한다.
#
# AWS 와의 차이
#   - 웹과 API 가 한 번에 배포된다 (deploy-api → URL 주입 → pages 3단계 → 1단계).
#   - API 가 같은 도메인의 /api 이므로 CORS 설정과 VITE_API_URL 주입이 필요 없다.
#   - 인증은 앱별 "배포 토큰" 이다 (AWS 역할이나 OIDC 가 아님).
#
# 그룹 CI/CD 변수 (Protected + Masked)
#   AZURE_STATIC_WEB_APPS_API_TOKEN   Static Web Apps 리소스의 배포 토큰
#                                     (프로젝트마다 리소스와 토큰이 따로 있다. 새 프로젝트 생성 시 플랫폼이 발급해 등록해야 함)
#
# 확인 필요: 배포 이미지 이름과 클라이언트 실행 방식은 Azure 공식 문서 기준으로 검증하지 못했다.
#            (Microsoft 가 제공하는 Static Web Apps 배포 클라이언트 이미지 사용)

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  NODE_IMAGE: node:22
  # Static Web Apps 배포 클라이언트 (Microsoft 제공 이미지). 사내 레지스트리 미러가 있으면 그 주소로 바꾼다.
  SWA_DEPLOY_IMAGE: mcr.microsoft.com/appsvc/staticappsclient:stable

stages:
  - build
  - deploy

# 웹(Vite → dist/)과 API(esbuild → api/dist/azure.js)를 각각 빌드한다.
build:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci
    - npm ci --prefix api
    - npm --prefix api run typecheck
    # VITE_API_URL 을 비워 두면 프론트가 "/api" 로 호출한다 (같은 도메인)
    - npm run build
    - npm --prefix api run build:azure
  artifacts:
    paths:
      - dist
      - api/dist
      - api/host.json
      - api/package.json
      - api/package-lock.json
      - staticwebapp.config.json

# 빌드 결과를 그대로 올린다 (Static Web Apps 가 다시 빌드하지 않도록 skip_app_build / skip_api_build 사용)
deploy:
  stage: deploy
  image:
    name: $SWA_DEPLOY_IMAGE
    entrypoint: [""]
  resource_group: azure-deploy
  needs: [build]
  script:
    - >
      /bin/staticsites/StaticSitesClient upload
      --app dist
      --api api
      --apiToken "$AZURE_STATIC_WEB_APPS_API_TOKEN"
      --skipAppBuild true
      --skipApiBuild true
