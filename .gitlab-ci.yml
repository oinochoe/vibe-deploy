# 사내 GitLab 파이프라인 — 1단계: 웹(Vite)만 GitLab Pages 에 배포한다.
#
# 기본 브랜치(main)에 커밋이 들어오면 MR 없이 바로 배포한다.
# 빌드(타입체크 포함)가 실패하면 배포되지 않고 이전 버전이 그대로 유지된다.
#
# 이 단계에서는 API 가 아직 없으므로 화면의 "API 호출" 부분은 오류로 보이는 것이 정상이다.
# API(Azure Functions) 배포는 다음 단계에서 이 파일에 job 을 추가한다.
#
# 러너 환경에 맞춰 build-web.sh 가 알아서 고르는 것들 (모두 선택 변수, scripts/ci/build-web.sh 참고)
#   NPM_REGISTRY        사내 npm 레지스트리 주소. 있으면 여기서 패키지를 받는다
#   NPM_CAFILE          사내 CA 인증서 파일 경로 (레지스트리가 사내 CA 를 쓸 때)
#   ci-offline/         러너에 Node 나 인터넷이 없을 때 쓰는 압축본 (node.tar.xz, node_modules.tar.gz)

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# GitLab 은 이름이 "pages" 인 job 의 public/ 을 웹으로 게시한다.
pages:
  stage: deploy
  script:
    # 웹 주소가 https://<도메인>/<프로젝트경로>/ 형태이므로 경로 부분을 Vite base 로 넘긴다 (에셋 경로가 맞아야 화면이 뜬다)
    - export VITE_BASE="$(printf '%s' "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##; s#/*$#/#')"
    - bash scripts/ci/build-web.sh
    # 빌드가 끝난 뒤이므로 소스의 public/ 이 있어도 덮어써도 된다
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
    expire_in: 1 week
